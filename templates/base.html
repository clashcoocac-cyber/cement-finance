<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"

<script>
    // Date pickers speak Uzbek and always show dd.mm.yyyy (the browser's own date input follows the browser's
    // locale and can show day and month the other way round). The real <input> keeps YYYY-MM-DD and its id, so the
    // filter scripts that read it (and the URL parameters) are unchanged; flatpickr fires `change` on it.
    flatpickr.localize({
        firstDayOfWeek: 1,
        weekdays: {
            shorthand: ['Yak', 'Dush', 'Sesh', 'Chor', 'Pay', 'Juma', 'Shan'],
            longhand: ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'],
        },
        months: {
            shorthand: ['Yan', 'Fev', 'Mar', 'Apr', 'May', 'Iyun', 'Iyul', 'Avg', 'Sen', 'Okt', 'Noy', 'Dek'],
            longhand: ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun', 'Iyul', 'Avgust', 'Sentabr', 'Oktabr', 'Noyabr', 'Dekabr'],
        },
    });
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('input[data-uz-date]').forEach(function (input) {
            const picker = flatpickr(input, { dateFormat: 'Y-m-d', altInput: true, altFormat: 'd.m.Y', disableMobile: true });
            picker.altInput.className = input.className;   // looks like the other fields
            picker.altInput.setAttribute('aria-label', 'Sana');
        });
    });
</script>
<script>
    // Deleting is a POST (with the CSRF token), never a plain link, so a stray visit or a foreign page cannot trigger it.
    function postTo(url) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = url;
        const token = document.createElement('input');
        token.type = 'hidden';
        token.name = 'csrfmiddlewaretoken';
        token.value = '{{ csrf_token }}';
        form.appendChild(token);
        document.body.appendChild(form);
        form.submit();
    }
</script>
