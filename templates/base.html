        <style>
            @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400..700&family=Inter:wght@400..700&display=swap');
            /* Public Sans has no Cyrillic: customer names fall back, glyph by glyph, to Inter */
            body { font-family: 'Public Sans', 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
            .modern-card {
                background: white;
                border: 1px solid #e5e7eb;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            }
            .gradient-bg {
                background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            }
            .card-hover {
                transition: all 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            }
        </style>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css"
              integrity="sha384-RkASv+6KfBMW9eknReJIJ6b3UnjKOKC5bOUaNgIY778NFbQ8MtWq9Lr/khUgqtTt" crossorigin="anonymous">
        <script>
            // Customer names reach the page as data (JSON); anything put into innerHTML goes through esc() first.
            function esc(value) {
                return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) {
                    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
                });
            }
        </script>
        <style>
            /* a field the server (or the form check) rejected */
            [aria-invalid="true"] { border-color: #dc2626 !important; box-shadow: 0 0 0 1px #dc2626; }
            .combo-active { background-color: #dbeafe; }
        </style>
        <script>
            // Group digits while typing (1500000 -> 1 500 000); a leading minus is kept (money given out, road cost).
            function groupAmount(input) {
                const negative = input.value.trim().startsWith('-');
                const digits = input.value.replace(/\D/g, '');
                input.value = (negative ? '-' : '') + digits.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }

            // Keyboard use for the customer search lists: arrows move, Enter chooses, Escape closes.
            function enhanceCombobox(inputId, listId) {
                const input = document.getElementById(inputId), list = document.getElementById(listId);
                if (!input || !list) return;
                input.setAttribute('role', 'combobox');
                input.setAttribute('aria-autocomplete', 'list');
                input.setAttribute('aria-controls', listId);
                input.setAttribute('aria-expanded', 'false');
                list.setAttribute('role', 'listbox');
                let active = -1;
                const items = () => Array.from(list.children);
                const mark = () => items().forEach((el, k) => {
                    el.setAttribute('role', 'option');
                    el.setAttribute('aria-selected', k === active ? 'true' : 'false');
                    el.classList.toggle('combo-active', k === active);
                    if (k === active) el.scrollIntoView({block: 'nearest'});
                });
                new MutationObserver(function () {
                    active = -1;
                    input.setAttribute('aria-expanded', list.classList.contains('hidden') ? 'false' : 'true');
                    items().forEach(el => el.setAttribute('role', 'option'));
                }).observe(list, {childList: true, attributes: true, attributeFilter: ['class']});
                input.addEventListener('keydown', function (e) {
                    const open = !list.classList.contains('hidden') && items().length;
                    if (e.key === 'ArrowDown' && !open) { input.dispatchEvent(new Event('input')); return; }
                    if (!open) return;
                    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(active + 1, items().length - 1); mark(); }
                    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(active - 1, 0); mark(); }
                    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); items()[active].click(); }
                    else if (e.key === 'Escape') { list.classList.add('hidden'); }
                });
            }

            // A customer must be CHOSEN from the list: typing a name alone leaves the hidden id empty, and typing
            // after choosing one drops the old choice, so a record can never go to the previously chosen customer.
            function guardCustomerSelection(formId, searchId, hiddenId, errorId) {
                const form = document.getElementById(formId), search = document.getElementById(searchId);
                const hidden = document.getElementById(hiddenId), error = document.getElementById(errorId);
                if (!form || !search || !hidden) return;
                search.addEventListener('input', function () {
                    hidden.value = '';
                    search.setAttribute('aria-invalid', 'false');
                    if (error) error.classList.add('hidden');
                });
                form.addEventListener('submit', function (e) {
                    if (hidden.value) return;
                    e.preventDefault();
                    search.setAttribute('aria-invalid', 'true');
                    if (error) { error.textContent = "Mijozni ro'yxatdan tanlang."; error.classList.remove('hidden'); }
                    search.focus();
                });
            }

            document.addEventListener('DOMContentLoaded', function () {
                enhanceCombobox('clientSearch', 'clientDropdown');
                enhanceCombobox('filterClientNameSearch', 'filterClientDropdown');
            });
        </script>
    </head>
    <body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen">

        {% if messages %}

            {% for message in messages %}
            <div role="alert" class="rounded-lg border px-4 py-3 text-sm {% if message.level_tag == 'error' %}border-red-200 bg-red-50 text-red-700{% else %}border-green-200 bg-green-50 text-green-600{% endif %}">{{ message }}</div>

        {% block content %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"
        integrity="sha384-5JqMv4L/Xa0hfvtF06qboNdhvuYXUku9ZrhZh3bSk8VXF0A/RuSLHpLsSV9Zqhl6" crossorigin="anonymous"></script>
<script>
    // Date pickers speak Uzbek and always show dd.mm.yyyy (the browser's own date input follows the browser's
    // locale and can show day and month the other way round). The real <input> keeps YYYY-MM-DD and its id, so the
    // filter scripts that read it (and the URL parameters) are unchanged; flatpickr fires `change` on it.
    flatpickr.localize({
        firstDayOfWeek: 1,
        weekdays: {
            shorthand: ['Yak', 'Dush', 'Sesh', 'Chor', 'Pay', 'Juma', 'Shan'],
            longhand: ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'],
        },
        months: {
            shorthand: ['Yan', 'Fev', 'Mar', 'Apr', 'May', 'Iyun', 'Iyul', 'Avg', 'Sen', 'Okt', 'Noy', 'Dek'],
            longhand: ['Yanvar', 'Fevral', 'Mart', 'Aprel', 'May', 'Iyun', 'Iyul', 'Avgust', 'Sentabr', 'Oktabr', 'Noyabr', 'Dekabr'],
        },
    });
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('input[data-uz-date]').forEach(function (input) {
            const picker = flatpickr(input, { dateFormat: 'Y-m-d', altInput: true, altFormat: 'd.m.Y', disableMobile: true });
            picker.altInput.className = input.className;   // looks like the other fields
            const label = input.id && document.querySelector('label[for="' + input.id + '"]');
            picker.altInput.setAttribute('aria-label', label ? label.textContent.trim() : 'Sana');
        });
    });
</script>
<script>
    // Anything that opens something when clicked (table rows, cards) can also be reached with Tab and opened with
    // Enter or Space, and is announced as a button.
    document.querySelectorAll('tr[onclick], td[onclick], div[onclick]:not([role])').forEach(function (el) {
        el.tabIndex = 0;
        el.setAttribute('role', 'button');
        el.addEventListener('keydown', function (e) {
            if (e.target === el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); el.click(); }
        });
    });
</script>
<script>
    // Deleting is a POST (with the CSRF token), never a plain link, so a stray visit or a foreign page cannot trigger it.
    function postTo(url) {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = url;
        const token = document.createElement('input');
        token.type = 'hidden';
        token.name = 'csrfmiddlewaretoken';
        token.value = '{{ csrf_token }}';
        form.appendChild(token);
        document.body.appendChild(form);
        form.submit();
    }
</script>

</html>
